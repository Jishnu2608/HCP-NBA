<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Next Best Action · Healthcare engagement</title>
    <meta
      name="description"
      content="Explainable, compliance-gated next best action for HCP and patient engagement. Proof of concept with synthetic data."
    />
    <meta name="theme-color" content="#f5f3ec" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Theme bootstrap. Runs before the stylesheet so the first paint already uses the right
      theme: the user's saved choice (same key as session.ts), otherwise the OS preference.
      theme.tsx takes over once the app has loaded.
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem("nba.theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0f1513" : "#f5f3ec");
      })();
    </script>
    <!-- Inline so it is served with the page; the API only serves /assets and index.html. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2324584a'/%3E%3Cpath d='M26 16h-4l-3 9-6-18-3 9H6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
